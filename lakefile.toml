name = "heights"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Heights", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

# Curves over number fields as function fields (Belyi.CurveField), for the height machine on
# curves (GenEll height theory, branch wp-height-theory).
[[require]]
name = "belyi"
git = "https://github.com/lana-agents/belyi.git"
rev = "9ce4d3f793d3bc831f2fc7214b7dbad90ea012d8"

[[lean_lib]]
name = "Heights"

# The comparator roots elaborate in separate environments. The challenge may
# contain only its four reviewed placeholders; the solution lists proved
# targets only.
[[lean_lib]]
name = "Challenge"
srcDir = "Comparator"

[[lean_lib]]
name = "Solution"
srcDir = "Comparator"
