automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5", "claude-sonnet-5"]
      framework: "Claude Code"
      tool_setup: >-
        orchestra for running the agents, taxis for project management, and Claude (Claude Code) as the
        coding agent; Lean/Lake builds with `lake build --wfail`.
      prompting_notes: >-
        Human input consisted of high-level task descriptions and scope decisions.
    - method: "agent"
      models: ["gpt-5.6-sol"]
      framework: "pi"
      tool_setup: >-
        The pi coding agent with the openai-codex/gpt-5.6-sol model (commit trailer
        "Co-Authored-By: pi (openai-codex/gpt-5.6-sol)"), used in the initial phase (2026-07-20 to
        2026-07-22: specification, comparator harness and the Silverman Proposition 2.1 work), with
        Lean/Lake builds and the repository's audit scripts (scripts/ci-checks.sh).
      prompting_notes: >-
        Human input consisted of high-level task descriptions and scope decisions.
  notes: >-
    Agents were run with orchestra; project management (issues, status) was done in taxis;
    Claude was the coding agent. The initial phase of the history (97 commits) was
    written by the pi agent with an OpenAI model, as recorded in the commit trailers.

fidelity:
  divergences: >-
    The elliptic-curve height h(W) in Proposition 2.1 is Heights.silvermanHeightOfCurve, defined by
    Silverman's formula (Prop. 1.1) with τ_v chosen through Heights.modularJ_surjective (the
    definition is independent of the choice); it is not identified with an Arakelov/Faltings height,
    and period integration and the Hodge metric are not formalized. Curves over number fields are
    represented by function fields (Belyi.CurveField). For [GenEll] Lemma 3.5 no Faltings height or
    quotient curve is constructed; only Vélu's product formula and the archimedean torsion bound are
    proved.

review:
  status: "agent-reviewed"
  reviewers: ["Claude (Anthropic)"]
  notes: >-
    The formalization has only been reviewed by Claude; it has not been reviewed by a human.
    All results are machine-checked by the Lean kernel; `#print axioms` of every main result listed
    under status (checked on a build of this revision) gives only propext, Classical.choice and
    Quot.sound. `git grep` finds no sorry, axiom declaration or native_decide in Heights/; the six
    sorries of Comparator/Challenge.lean are the comparator's deliberate statement placeholders.

alignment:
  namespace: "Heights"
  statements:
    - source: "Silverman, Heights and Elliptic Curves, Prop. 2.1"
      lean: "Heights.proposition_2_1, Heights.proposition_2_1_semistable"
      module: "Heights/IdealFactorization.lean"
      status: "proved"
      note: "For the formula-defined height silvermanHeightOfCurve, not the Faltings height."
    - source: "[GenEll] Prop. 1.6 (log-cond ≲ height)"
      lean: "Heights.Curve.logCondOf_le_tupleHeight_sub, Heights.Curve.logCondOf_le_divHeight"
      module: "Heights/Curve/CondHeight.lean, Heights/Curve/CondDivisor.lean"
      status: "proved"
    - source: "[GenEll] Thm. 2.1, compactness argument"
      lean: "Heights.Curve.exists_subseq_bounded"
      module: "Heights/Curve/Compactness.lean"
      status: "proved"

acknowledgements: "Built on Mathlib (Apache-2.0)."
