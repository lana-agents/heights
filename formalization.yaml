version: "v0.4"

project:
  name: "heights"
  description: >-
    A Lean 4 / Mathlib formalization of heights on elliptic curves and on curves over number fields.
    It proves Silverman's comparison (Heights and Elliptic Curves, Prop. 2.1) between the Weil
    height of j and the elliptic-curve height defined by Silverman's formula (minimal discriminant
    plus the archimedean term |Δ(τ_v)| (Im τ_v)^6), with the supporting analytic theory (the modular
    j-function and fundamental-domain estimates, the lattice-quotient uniformization, the compact
    complex-manifold structure on nonsingular complex Weierstrass curves). It also contains the
    height machine on curves over number fields of Mochizuki's Arithmetic elliptic curves in general
    position §1 (heights of tuples and divisors, log-different and log-conductor, log-cond ≲ height,
    the compactness argument of Thm. 2.1), bounds on differents, conductors and discriminants
    (Serre's bound, Kummer–Fermat extensions), absolute heights and Northcott over ℚ̄, and two
    isogeny estimates (Vélu's product formula, x-coordinates of N-torsion points over ℂ are O(N²)).
  authors:
    - "Claude (Anthropic)"
    - "LANA Project"
    - "Dagur Asgeirsson"
    - "Christian Merten"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "Heights and elliptic curves"
    authors: ["Joseph H. Silverman"]
    type: "book chapter"
    location: >-
      Ch. X of G. Cornell, J. H. Silverman (eds.), Arithmetic Geometry, Springer 1986;
      Prop. 1.1 and Prop. 2.1
    relationship: "formalizes"
    note: >-
      Proposition 2.1 is formalized for the height h(W) defined by Silverman's formula (Prop. 1.1);
      this height is not identified with the Faltings height (see fidelity.divergences). The chapter
      itself is not in the repository.
    author_endorsement: "not-contacted"
  - title: "Arithmetic elliptic curves in general position"
    authors: ["Shinichi Mochizuki"]
    type: "article"
    location: "Math. J. Okayama Univ. 52 (2010), §1-2 (Prop. 1.4, Def. 1.5, Rem. 1.5.1, Prop. 1.6, Prop. 1.7, Thm. 2.1), Lemma 3.5"
    relationship: "adapts"
    note: >-
      The height machine on curves, the log-conductor bounds and the number-field core of Prop. 1.7
      are formalized; for Lemma 3.5 only the isogeny estimates used by lana-agents/iut are proved,
      without a Faltings height or a quotient curve.
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/lana-agents/belyi"
    relationship: "builds-on"
    note: "Lake dependency (pinned 9ce4d3f); Belyi.CurveField provides the function fields, places and divisors."
  - id: "https://github.com/lana-agents/iut"
    relationship: "other"
    note: "Used by: iut pins heights at 721496c (cyclic-subgroup bound, general position, log-differents)."
  - id: "https://github.com/lana-agents/genl"
    relationship: "other"
    note: "Used by: the lana-agents fork of genl builds Genl.Curves on Heights.Curve and Heights.Different."

classification:
  arxiv: ["math.NT", "math.AG"]
  msc2020: ["11G50", "11G05", "14G40", "11R29"]

